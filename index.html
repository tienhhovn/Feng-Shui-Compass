<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Bàn Phong Thủy Bát Trạch Chuẩn Mẫu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #022c22; color: #ecfdf5; }
        .compass-ring { transition: transform 0.08s linear; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 max-w-md mx-auto">

    <!-- Header -->
    <header class="text-center py-1">
        <h1 class="text-base font-extrabold text-emerald-400 tracking-wide">🧭 LA BÀN PHONG THỦY BÁT TRẠCH</h1>
        <p class="text-[11px] text-emerald-200/70">Mô phỏng chuẩn phong thủy truyền thống</p>
    </header>

    <!-- Màn hình 1: Nhập thông tin gia chủ (Tông Xanh Emerald) -->
    <div id="setup-screen" class="bg-gradient-to-b from-emerald-950 to-teal-950 border-2 border-emerald-500/50 rounded-2xl p-4 shadow-2xl my-auto">
        <h2 class="text-sm font-bold text-emerald-300 mb-3 text-center uppercase tracking-wider">Nhập Thông Tin Gia Chủ</h2>
        <div class="space-y-3">
            <div>
                <label class="block text-xs text-emerald-200/80 mb-1">Năm sinh (Dương lịch)</label>
                <input type="number" id="birth-year" placeholder="Ví dụ: 1990" class="w-full bg-emerald-950/80 border border-emerald-600/60 rounded-xl px-4 py-2.5 text-emerald-100 focus:outline-none focus:border-emerald-400 text-sm shadow-inner">
            </div>
            <div>
                <label class="block text-xs text-emerald-200/80 mb-1">Giới tính</label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="setGender('nam')" id="btn-nam" class="py-2.5 rounded-xl border border-emerald-400 bg-emerald-900 font-bold text-sm transition text-emerald-200 shadow-md">Nam</button>
                    <button type="button" onclick="setGender('nu')" id="btn-nu" class="py-2.5 rounded-xl border border-emerald-800 bg-emerald-950 font-medium text-sm transition text-emerald-400/60">Nữ</button>
                </div>
            </div>
            <button onclick="initCompass()" class="w-full bg-gradient-to-r from-emerald-500 via-teal-400 to-emerald-600 text-stone-950 font-extrabold py-3 rounded-xl shadow-lg mt-2 active:scale-95 transition tracking-wide text-sm">
                BẮT ĐẦU ĐO LA BÀN
            </button>
        </div>
    </div>

    <!-- Màn hình 2: Giao diện La bàn chính (Ẩn ban đầu) -->
    <div id="compass-screen" class="hidden flex-col items-center flex-1 justify-between py-1">
        <!-- Thông tin tóm tắt gia chủ -->
        <div class="w-full bg-emerald-950 border border-emerald-500/40 rounded-xl px-3 py-1.5 flex justify-between items-center text-xs shadow">
            <div>Mệnh: <span id="info-menh" class="font-bold text-emerald-400">-</span></div>
            <button onclick="resetSetup()" class="text-emerald-300 underline hover:text-white text-[11px]">Đổi tuổi</button>
        </div>

        <!-- Trạng thái hướng đang quay -->
        <div class="text-emerald-300 text-xs font-bold uppercase tracking-wider bg-emerald-950 px-3 py-1 rounded-full border border-emerald-500/50 shadow">
            Hướng: <span id="current-direction-name" class="text-emerald-400 font-extrabold">--</span> (<span id="current-angle">0</span>°)
        </div>

        <!-- Vòng quay La bàn chứa hình ảnh mẫu chuẩn sắc nét -->
        <div class="relative w-76 h-76 my-2 flex items-center justify-center">
            <!-- Kim chỉ hướng đỏ cố định trên đỉnh -->
            <div class="absolute top-0 z-30 w-1.5 h-8 bg-red-600 -translate-y-2 rounded-full shadow-lg border border-yellow-400"></div>
            
            <!-- Mặt la bàn chứa ảnh mẫu xoay -->
            <div id="compass-dial" class="compass-ring relative w-72 h-72 rounded-full border-4 border-amber-500 bg-stone-900 shadow-2xl flex items-center justify-center overflow-hidden">
                <!-- Chèn trực tiếp hình ảnh la bàn mẫu chuẩn chất lượng cao -->
                <img src="https://images.unsplash.com/photo-1..." id="compass-img" alt="La Ban" class="w-full h-full object-cover rounded-full" crossorigin="anonymous">
            </div>
        </div>

        <!-- Bảng kết quả phong thủy chi tiết -->
        <div id="result-box" class="w-full bg-emerald-950/90 border border-emerald-500/60 rounded-2xl p-3 shadow-xl transition-all duration-300">
            <div class="flex justify-between items-center mb-1">
                <h3 id="res-star" class="text-sm font-bold text-emerald-300">-</h3>
                <span id="res-badge" class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase">-</span>
            </div>
            <p id="res-desc" class="text-[11px] text-emerald-100/90 mb-1 leading-relaxed">-</p>
            <div id="remedy-container" class="hidden border-t border-emerald-500/30 pt-1.5 mt-1.5">
                <div class="text-[10px] font-bold text-rose-300 mb-0.5">🛠 Cách hóa giải hướng xấu:</div>
                <p id="res-remedy" class="text-[10px] text-emerald-100/80 leading-relaxed">-</p>
            </div>
        </div>

        <!-- Nút cấp quyền iOS -->
        <button id="permission-btn" onclick="requestSensors()" class="hidden w-full bg-emerald-400 text-stone-950 font-bold py-2 rounded-xl text-xs mt-1">
            Cấp quyền cảm biến la bàn (iOS)
        </button>
    </div>

    <!-- Footer -->
    <footer class="text-center text-[10px] text-emerald-300/50 py-1">
        La Bàn Phong Thủy Bát Trạch • Chuẩn Mẫu Thực Tế
    </footer>

    <!-- Script xử lý -->
    <script>
        // Gán nguồn ảnh mẫu chuẩn la bàn bạn cung cấp vào thẻ img
        document.getElementById('compass-img').src = "data:image/jpeg;base64,..."; // Hoặc link trực tiếp hình ảnh la bàn mẫu

        let selectedGender = 'nam';
        let userGiaTriMenh = ''; 

        function setGender(gender) {
            selectedGender = gender;
            if (gender === 'nam') {
                document.getElementById('btn-nam').className = "py-2.5 rounded-xl border border-emerald-400 bg-emerald-900 font-bold text-sm transition text-emerald-200 shadow-md";
                document.getElementById('btn-nu').className = "py-2.5 rounded-xl border border-emerald-800 bg-emerald-950 font-medium text-sm transition text-emerald-400/60";
            } else {
                document.getElementById('btn-nu').className = "py-2.5 rounded-xl border border-emerald-400 bg-emerald-900 font-bold text-sm transition text-emerald-200 shadow-md";
                document.getElementById('btn-nam').className = "py-2.5 rounded-xl border border-emerald-800 bg-emerald-950 font-medium text-sm transition text-emerald-400/60";
            }
        }

        function calculateBhatTrach(year, gender) {
            let sum = year.toString().split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
            while (sum > 9) {
                sum = sum.toString().split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
            }
            
            let kou = 0;
            if (year < 2000) {
                if (gender === 'nam') kou = 11 - sum;
                else kou = 4 + sum;
            } else {
                if (gender === 'nam') kou = 9 - sum;
                else kou = 6 + sum;
            }
            while (kou > 9) {
                kou = kou.toString().split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
            }
            if (kou === 5) kou = gender === 'nam' ? 2 : 8;

            const dongTuMenh = [1, 3, 4, 9];
            if (dongTuMenh.includes(kou)) {
                return { group: 'dong', text: 'Đông Tứ Mệnh' };
            } else {
                return { group: 'tay', text: 'Tây Tứ Mệnh' };
            }
        }

        function initCompass() {
            const yearInput = document.getElementById('birth-year').value;
            if (!yearInput || yearInput < 1900 || yearInput > 2026) {
                alert('Vui lòng nhập năm sinh hợp lệ!');
                return;
            }

            const result = calculateBhatTrach(parseInt(yearInput), selectedGender);
            userGiaTriMenh = result.group;

            document.getElementById('info-menh').innerText = `${result.text} (${selectedGender === 'nam' ? 'Nam' : 'Nữ'})`;
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('compass-screen').classList.remove('hidden');
            document.getElementById('compass-screen').classList.add('flex');

            startCompassSensor();
        }

        function resetSetup() {
            document.getElementById('compass-screen').classList.add('hidden');
            document.getElementById('compass-screen').classList.remove('flex');
            document.getElementById('setup-screen').classList.remove('hidden');
            window.removeEventListener('deviceorientation', handleOrientation);
        }

        const directionsData = {
            dong: {
                "Bắc": { name: "Sinh Khí (Đại Cát)", type: "tot", desc: "Hướng vượng tài lộc, sự nghiệp hanh thông, danh tiếng vang xa.", remedy: "" },
                "Đông Nam": { name: "Diên Năm (Cát)", type: "tot", desc: "Gia đạo hòa hợp, tình cảm gắn kết, sức khỏe dồi dào.", remedy: "" },
                "Nam": { name: "Thiên Y (Cát)", type: "tot", desc: "Gặp dữ hóa lành, bệnh tật thuyên giảm, có quý nhân phù trợ.", remedy: "" },
                "Đông": { name: "Phục Vị (Cát)", type: "tot", desc: "Củng cố tinh thần, mang lại sự bình an và may mắn hàng ngày.", remedy: "" },
                
                "Tây Nam": { name: "Tuyệt Mệnh (Đại Hung)", type: "hung", desc: "Dễ hao tài tốn của, bệnh tật bất ngờ, thị phi kiện tụng.", remedy: "Dùng gương Bát quái lồi trước cửa để trấn trạch, trải thảm màu trắng/xám để tiết khí." },
                "Đông Bắc": { name: "Ngũ Quỷ (Hung)", type: "hung", desc: "Dễ gặp hỏa hoạn, mất cắp, tiểu nhân hãm hại, nội bộ lục đục.", remedy: "Sử dụng vật phẩm hành Thủy (hòn non bộ, tiểu cảnh nước) để chế ngự hỏa khí." },
                "Tây Bắc": { name: "Lục Sát (Hung)", type: "hung", desc: "Quan hệ tình cảm rạn nứt, tai tiếng thị phi, công việc trắc trở.", remedy: "Dùng bình phong che chắn lối khí xấu, đặt chậu cây xanh phù hợp." },
                "Tây": { name: "Họa Hại (Hung)", type: "hung", desc: "Hay bị tiểu nhân quấy phá, bất hòa trong gia đình, hao tổn sức khỏe.", remedy: "Sử dụng đá thạch anh tự nhiên (hành Thổ) để trấn áp địa khí." }
            },
            tay: {
                "Tây Bắc": { name: "Sinh Khí (Đại Cát)", type: "tot", desc: "Vượng tài lộc, sự nghiệp thăng tiến mạnh mẽ, năng lượng sống tích cực.", remedy: "" },
                "Tây": { name: "Diên Năm (Cát)", type: "tot", desc: "Gia đạo an khang thịnh vượng, tình cảm bền chặt, công danh vững chắc.", remedy: "" },
                "Đông Bắc": { name: "Thiên Y (Cát)", type: "tot", desc: "Lợi cho sức khỏe, trường thọ, gặp quý nhân che chở.", remedy: "" },
                "Tây Nam": { name: "Phục Vị (Cát)", type: "tot", desc: "Bình yên nội tâm, tài chính vững vàng, củng cố ý chí.", remedy: "" },
                
                "Đông Nam": { name: "Tuyệt Mệnh (Đại Hung)", type: "hung", desc: "Tổn hại tài chính nghiêm trọng, rủi ro tai nạn, bệnh tật.", remedy: "Dùng gương Bát quái lồi phản xạ sát khí, kết hợp thảm màu sẫm." },
                "Bắc": { name: "Ngũ Quỷ (Hung)", type: "hung", desc: "Dễ sinh bệnh tật, hao tài tốn của, tiểu nhân lừa gạt.", remedy: "Sử dụng thác nước phong thủy nhỏ để làm suy yếu hỏa khí." },
                "Đông": { name: "Lục Sát (Hung)", type: "hung", desc: "Gây tổn hại quan hệ, kiện tụng, tai nạn, tiền tài khó tụ.", remedy: "Dùng bình phong hoặc tủ kệ chắn ngay hướng xấu, giữ không gian sạch sẽ." },
                "Nam": { name: "Họa Hại (Hung)", type: "hung", desc: "Hay gặp tai họa bất ngờ, thị phi, tinh thần mệt mỏi.", remedy: "Sử dụng vật phẩm phong thủy hành Thổ hoặc đá thạch anh." }
            }
        };

        function getDirectionName(deg) {
            const normalized = (deg % 360 + 360) % 360;
            if (normalized >= 337.5 || normalized < 22.5) return "Bắc";
            if (normalized >= 22.5 && normalized < 67.5) return "Đông Bắc";
            if (normalized >= 67.5 && normalized < 112.5) return "Đông";
            if (normalized >= 112.5 && normalized < 157.5) return "Đông Nam";
            if (normalized >= 157.5 && normalized < 202.5) return "Nam";
            if (normalized >= 202.5 && normalized < 247.5) return "Tây Nam";
            if (normalized >= 247.5 && normalized < 292.5) return "Tây";
            if (normalized >= 292.5 && normalized < 337.5) return "Tây Bắc";
            return "Bắc";
        }

        let lastProcessedDir = "";

        function handleOrientation(event) {
            let compass = event.alpha;
            if (event.webkitCompassHeading !== undefined) {
                compass = event.webkitCompassHeading;
            }

            if (compass === null || compass === undefined) {
                return;
            }

            const dial = document.getElementById('compass-dial');
            dial.style.transform = `rotate(${-compass}deg)`;

            const roundedAngle = Math.round(compass);
            document.getElementById('current-angle').innerText = roundedAngle;

            const dirName = getDirectionName(compass);
            document.getElementById('current-direction-name').innerText = dirName;

            if (dirName !== lastProcessedDir) {
                lastProcessedDir = dirName;
                updateFengShuiResult(dirName);
            }
        }

        function updateFengShuiResult(dirName) {
            const dataMap = directionsData[userGiaTriMenh][dirName];
            if (!dataMap) return;

            document.getElementById('res-star').innerText = `${dirName}: ${dataMap.name}`;
            const badge = document.getElementById('res-badge');
            const resultBox = document.getElementById('result-box');
            const remedyContainer = document.getElementById('remedy-container');

            if (dataMap.type === 'tot') {
                badge.innerText = "CÁT TƯỜNG";
                badge.className = "px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase bg-emerald-400 text-stone-950 shadow";
                resultBox.className = "w-full bg-emerald-950/90 border border-emerald-400 rounded-2xl p-3 shadow-xl transition-all duration-300";
                remedyContainer.classList.add('hidden');
            } else {
                badge.innerText = "HUNG GIAO";
                badge.className = "px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase bg-rose-700 text-white shadow";
                resultBox.className = "w-full bg-emerald-950/90 border border-rose-600 rounded-2xl p-3 shadow-xl transition-all duration-300";
                remedyContainer.classList.remove('hidden');
                document.getElementById('res-remedy').innerText = dataMap.remedy;
            }

            document.getElementById('res-desc').innerText = dataMap.desc;
        }

        function startCompassSensor() {
            if (typeof window.DeviceOrientationEvent !== 'undefined' && typeof window.DeviceOrientationEvent.requestPermission === 'function') {
                document.getElementById('permission-btn').classList.remove('hidden');
            } else if ('ondeviceorientationabsolute' in window || 'ondeviceorientation' in window) {
                window.addEventListener('deviceorientation', handleOrientation, true);
            } else {
                alert("Thiết bị của bạn không hỗ trợ cảm biến định hướng la bàn!");
            }
        }

        function requestSensors() {
            if (typeof window.DeviceOrientationEvent.requestPermission === 'function') {
                window.DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                            document.getElementById('permission-btn').classList.add('hidden');
                        } else {
                            alert("Ứng dụng cần quyền truy cập cảm biến để chạy la bàn.");
                        }
                    })
                    .catch(console.error);
            }
        }
    </script>
</body>
</html>
